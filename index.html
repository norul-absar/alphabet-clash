<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alphabet-clash</title>
    <!-- Diasy ui -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- CSS -->
    <link rel="stylesheet" href="style/style.css">

</head>

<body class="font-poppins">
    <main class="min-h-screen bg-blue-950 bg-[url(images/images/background.png)] bg-no-repeat bg-center">
        <!-- Home screen -->
        <section id="home-screen" class="home ">
            <div class="flex flex-col items-center h-screen justify-center gap-8">
                <h1 class="text-8xl text-white">Alpaha Clash</h1>
                <p class="text-white">Lorem, ipsum dolor sit amet consectetur adipisicing elit. In ad dolore adipisci!
                </p>
                <button onclick="play()" class="btn">Play now</button>

            </div>

        </section>

        <!-- Pay ground -->
        <section id="payground-section"  class="play-ground flex flex-col justify-center items-center h-screen gap-16 hidden">
            <!-- screen -->
            <div class="aura aura-rainbow">
                <div class="card w-96 h-32 bg-base-100 shadow-sm ">
                    <div class="card-body flex justify-center items-center">
                        <p>Do not play on mobile</p>
                        <h2 id="curent-alphabet" class="text-5xl font-bold uppercase">Premium</h2>
                    </div>
                </div>
            </div>
            <!-- Keyboard start-->
            <div>
                <div class="my-1 flex w-full justify-center gap-1">
                    <kbd id="q" class="kbd">q</kbd>
                    <kbd id="w" class="kbd">w</kbd>
                    <kbd id="e" class="kbd">e</kbd>
                    <kbd id="r" class="kbd">r</kbd>
                    <kbd id="t" class="kbd">t</kbd>
                    <kbd id="y" class="kbd">y</kbd>
                    <kbd id="u" class="kbd">u</kbd>
                    <kbd id="i" class="kbd">i</kbd>
                    <kbd id="o" class="kbd">o</kbd>
                    <kbd id="p" class="kbd">p</kbd>
                </div>
                <div class="my-1 flex w-full justify-center gap-1">
                    <kbd id="a" class="kbd">a</kbd>
                    <kbd id="s" class="kbd">s</kbd>
                    <kbd id="d" class="kbd">d</kbd>
                    <kbd id="f" class="kbd">f</kbd>
                    <kbd id="g" class="kbd">g</kbd>
                    <kbd id="h" class="kbd">h</kbd>
                    <kbd id="j" class="kbd">j</kbd>
                    <kbd id="k" class="kbd">k</kbd>
                    <kbd id="l" class="kbd">l</kbd>
                </div>
                <div class="my-1 flex w-full justify-center gap-1">
                    <kbd id="z" class="kbd">z</kbd>
                    <kbd id="x" class="kbd">x</kbd>
                    <kbd id="c" class="kbd">c</kbd>
                    <kbd id="v" class="kbd">v</kbd>
                    <kbd id="b" class="kbd">b</kbd>
                    <kbd id="n" class="kbd">n</kbd>
                    <kbd id="m" class="kbd">m</kbd>
                    <kbd class="kbd">/</kbd>
                </div>
            </div>

            <!-- live score -->
             <div class="flex justify-between gap-6 w-3/4">
                <button class="btn rounded-full">Life <span id="current-life">5</span></button>
                <button class="btn rounded-full">Score <span id="current-score">0</span></button>
             </div>

        </section>

        <section id="Final-score" class=" flex flex-col justify-center items-center h-screen hidden ">
            <div class="text-white text-center bg-yellow-400 p-8 space-y-4 rounded-xl">
                <h2 class="text-4xl">
                    <span class="font-extrabold">Score:</span>
                    <span id="last-score">14</span>
                </h2>
                <button onclick="play()" class="btn">Play again</button>
                <p>Practice will make you a pro</p>
            </div>

        </section>

    </main>



    <script src="script/script.js"></script>
    <script src="script/utility.js"></script>





</body>

</html>
